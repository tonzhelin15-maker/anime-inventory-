<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17151f" />
  <title>動漫攤位庫存</title>
  <style>
    :root{--bg:#f5f3ef;--panel:#fff;--ink:#22202a;--muted:#77727e;--line:#e9e4df;--accent:#7657d9;--accent2:#ede8ff;--danger:#c84b62;--green:#218866;--shadow:0 8px 24px #27202b0e}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
    button,input,select{font:inherit} button{border:0;cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}
    aside{background:#17151f;color:#fff;padding:28px 18px;display:flex;flex-direction:column;gap:26px}.brand{font-size:21px;font-weight:800;letter-spacing:.04em}.brand small{display:block;color:#a8a1b5;font-size:12px;font-weight:500;margin-top:2px}.nav{display:grid;gap:8px}.nav button{background:transparent;color:#c8c2d2;text-align:left;padding:12px 14px;border-radius:12px}.nav button.active,.nav button:hover{background:#302948;color:#fff}.aside-note{margin-top:auto;color:#9f99aa;font-size:12px;padding:12px}
    main{padding:28px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.eyebrow{color:var(--accent);font-size:13px;font-weight:700}.top h1{margin:2px 0 0;font-size:30px}.date{color:var(--muted);font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{padding:11px 16px;border-radius:11px;background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:700}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--danger)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:18px}.stat label{color:var(--muted);font-size:13px}.stat strong{display:block;font-size:27px;margin-top:5px}.stat span{font-size:12px;color:var(--green)}
    .layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,.8fr);gap:20px}.panel{padding:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.panel h2{font-size:18px;margin:0}.search{display:flex;gap:10px}.input,.select{background:#fbfaf9;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;width:100%}.input:focus{border-color:var(--accent)}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th{text-align:left;color:var(--muted);font-size:12px;font-weight:600;border-bottom:1px solid var(--line);padding:10px 8px}.table td{padding:14px 8px;border-bottom:1px solid #f0ece8;vertical-align:middle}.product{display:flex;align-items:center;gap:11px;min-width:210px}.thumb{width:42px;height:42px;border-radius:10px;background:var(--accent2);display:grid;place-items:center;font-size:20px}.product b{display:block}.product small{color:var(--muted)}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#f1efec;color:#625c68;font-size:12px}.stock{font-weight:800}.stock.low{color:var(--danger)}.row-actions{display:flex;gap:6px}.icon-btn{background:#f4f1fa;color:var(--accent);border-radius:8px;padding:7px 9px;font-size:12px;font-weight:700}.icon-btn.sell{background:#eaf7f1;color:var(--green)}
    .form{display:grid;gap:11px}.form label{font-size:13px;color:var(--muted)}.form .field{display:grid;gap:5px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.log{display:grid;gap:10px;margin-top:18px}.log-item{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px}.log-item small{color:var(--muted);display:block}.plus{color:var(--green);font-weight:800}.minus{color:var(--danger);font-weight:800}.empty{text-align:center;color:var(--muted);padding:35px 10px}.toast{position:fixed;right:22px;bottom:22px;background:#25212d;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(12px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}.modebar{display:flex;gap:8px;margin-bottom:18px}.modebar button{padding:10px 16px;border-radius:10px;background:#ebe7e2;color:var(--muted);font-weight:800}.modebar button.active{background:var(--accent);color:#fff}.hidden{display:none!important}.pos{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:20px}.scanbox{display:flex;gap:10px;margin-bottom:16px}.scanbox .input{font-size:18px}.cart-list{display:grid;gap:8px;min-height:130px}.cart-item{display:grid;grid-template-columns:1fr auto auto auto;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.qty{display:flex;align-items:center;gap:8px}.qty button{width:28px;height:28px;border-radius:7px;background:var(--accent2);color:var(--accent);font-weight:800}.total{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:16px;padding-top:16px;font-size:20px;font-weight:800}.pay-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
    @media(max-width:1050px){.app{grid-template-columns:86px 1fr}aside{padding:24px 12px}.brand{font-size:0;text-align:center}.brand:first-letter{font-size:25px}.brand small{display:none}.nav button{font-size:0;text-align:center;padding:12px}.nav button:first-letter{font-size:20px}.aside-note{display:none}.layout,.pos{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:650px){.app{display:block}aside{height:auto;padding:10px 14px;display:flex;flex-direction:row;align-items:center;gap:14px;position:sticky;top:0;z-index:2}.brand{font-size:16px;text-align:left;white-space:nowrap}.brand small{display:block}.nav{display:flex;overflow:auto;gap:4px}.nav button{font-size:13px;white-space:nowrap;padding:8px 10px}.nav button:first-letter{font-size:inherit}main{padding:18px 14px}.top{display:block}.top h1{font-size:25px;margin-bottom:4px}.actions{margin-top:14px}.actions .btn{flex:1}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:22px}.panel{padding:15px}.panel-head{align-items:flex-start;flex-direction:column}.search{width:100%}.form-row{grid-template-columns:1fr}.table{min-width:620px}}
  </style>
</head>
<body>
  <div class="app">
    <aside><div class="brand">🎴 動漫攤位<small>Inventory Lite</small></div><nav class="nav"><button class="active">📦 庫存總覽</button><button>🧾 銷售紀錄</button><button>📊 報表</button></nav><div class="aside-note">第一版資料會儲存在目前瀏覽器，之後可接雲端同步。</div></aside>
    <main>
      <header class="top"><div><div class="eyebrow">ANIME STALL MANAGEMENT</div><h1>庫存總覽</h1><div class="date" id="today"></div></div><div class="actions"><button class="btn" id="exportBtn">匯出資料</button><button class="btn primary" id="focusForm">＋ 新增商品</button></div></header>
      <section class="stats"><div class="stat"><label>商品種類</label><strong id="skuCount">0</strong><span>目前有紀錄的品項</span></div><div class="stat"><label>庫存件數</label><strong id="unitCount">0</strong><span>所有商品合計</span></div><div class="stat"><label>庫存成本</label><strong id="costTotal">$0</strong><span>依購入成本估算</span></div><div class="stat"><label>低庫存</label><strong id="lowCount">0</strong><span>庫存 ≤ 2 件</span></div></section>
      <div class="modebar"><button class="active" id="inventoryMode">📦 庫存管理</button><button id="posMode">🧾 POS 結帳</button></div>
      <section class="pos hidden" id="posPanel"><div class="panel"><div class="panel-head"><h2>掃描商品結帳</h2><span class="badge">條碼機可直接輸入</span></div><div class="scanbox"><input class="input" id="barcodeInput" placeholder="掃描或輸入 SKU／條碼後按 Enter" autocomplete="off" /><button class="btn primary" id="scanBtn">加入</button></div><div class="empty" id="scanHint">把游標放在輸入框，使用藍牙條碼掃描器掃描商品。</div></div><div class="panel"><div class="panel-head"><h2>目前購物車</h2><span class="badge" id="cartCount">0 件</span></div><div class="cart-list" id="cartList"><div class="empty">尚未加入商品</div></div><div class="total"><span>應收金額</span><span id="cartTotal">$0</span></div><div class="pay-row"><select class="select" id="payment"><option>現金</option><option>Line Pay</option><option>轉帳</option><option>其他</option></select><button class="btn primary" id="checkoutBtn">完成結帳</button></div></div></section>
      <div class="layout" id="inventoryLayout"><section class="panel"><div class="panel-head"><h2>商品清單</h2><div class="search"><input class="input" id="search" placeholder="搜尋品名、作品或分類" /><select class="select" id="filter"><option value="all">全部分類</option></select></div></div><div class="table-wrap"><table class="table"><thead><tr><th>商品</th><th>分類</th><th>購入價</th><th>售價</th><th>庫存</th><th>操作</th></tr></thead><tbody id="productRows"></tbody></table><div class="empty" id="empty">目前還沒有商品，先從右側新增第一項吧。</div></div></section>
        <section class="panel" id="formPanel"><div class="panel-head"><h2>快速新增商品</h2><span class="badge">可不填圖片與備註</span></div><form class="form" id="productForm"><div class="field"><label>商品名稱 *</label><input class="input" name="name" required placeholder="例如：原神 魈吧唧" /></div><div class="form-row"><div class="field"><label>作品／IP</label><input class="input" name="series" placeholder="例如：原神" /></div><div class="field"><label>分類</label><select class="select" name="category"><option>徽章</option><option>立牌</option><option>吊飾</option><option>卡片</option><option>模型</option><option>其他</option></select></div></div><div class="form-row"><div class="field"><label>購入價</label><input class="input" name="cost" type="number" min="0" value="0" /></div><div class="field"><label>售價</label><input class="input" name="price" type="number" min="0" value="0" /></div></div><div class="form-row"><div class="field"><label>初始庫存</label><input class="input" name="stock" type="number" min="0" value="0" /></div><div class="field"><label>庫存位置</label><input class="input" name="location" placeholder="例如：A箱／展示架" /></div></div><div class="field"><label>備註</label><input class="input" name="note" placeholder="可不填" /></div><button class="btn primary" type="submit">儲存商品</button></form><div class="log"><h2>最近異動</h2><div id="logs"><div class="empty">新增或調整庫存後會顯示在這裡。</div></div></div></section></div>
    </main>
  </div><div class="toast" id="toast"></div>
  <script>
    const KEY='anime-stall-inventory-v1';
    let state=JSON.parse(localStorage.getItem(KEY)||'null')||{products:[],logs:[]};
    state.products=state.products.map(p=>({...p,sku:p.sku||'',barcode:p.barcode||''}));
    const form=$('#productForm');form.insertAdjacentHTML('afterbegin','<div class="form-row"><div class="field"><label>SKU／商品編號</label><input class="input" name="sku" placeholder="例如：GEN-001" /></div><div class="field"><label>條碼／QR Code</label><input class="input" name="barcode" placeholder="可貼商品原有條碼" /></div></div>');
    let cart=[];
    const $=s=>document.querySelector(s), money=n=>'$'+Number(n||0).toLocaleString('zh-TW');
    function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
    function notify(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
    function render(){const q=$('#search').value.toLowerCase(), f=$('#filter').value;const products=state.products.filter(p=>(f==='all'||p.category===f)&&[p.name,p.series,p.category,p.sku,p.barcode].join(' ').toLowerCase().includes(q));
      $('#skuCount').textContent=state.products.length;$('#unitCount').textContent=state.products.reduce((a,p)=>a+Number(p.stock),0);$('#costTotal').textContent=money(state.products.reduce((a,p)=>a+Number(p.cost)*Number(p.stock),0));$('#lowCount').textContent=state.products.filter(p=>Number(p.stock)<=2).length;
      const cats=[...new Set(state.products.map(p=>p.category))];const filter=$('#filter');const old=filter.value;filter.innerHTML='<option value="all">全部分類</option>'+cats.map(c=>`<option>${c}</option>`).join('');filter.value=cats.includes(old)?old:'all';
      $('#productRows').innerHTML=products.map(p=>`<tr><td><div class="product"><div class="thumb">${p.category==='模型'?'🧸':p.category==='卡片'?'🃏':'✨'}</div><div><b>${esc(p.name)}</b><small>${esc(p.series||'未填作品')} ${p.location?'・'+esc(p.location):''}</small></div></div></td><td><span class="badge">${esc(p.category)}</span></td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td><span class="stock ${p.stock<=2?'low':''}">${p.stock}</span></td><td><div class="row-actions"><button class="icon-btn sell" onclick="adjust('${p.id}',-1)">售出</button><button class="icon-btn" onclick="adjust('${p.id}',1)">入庫</button></div></td></tr>`).join('');$('#empty').style.display=products.length?'none':'block';$('#logs').innerHTML=state.logs.slice(0,6).map(l=>`<div class="log-item"><div><b>${esc(l.name)}</b><small>${l.type}・${l.time}</small></div><span class="${l.qty>0?'plus':'minus'}">${l.qty>0?'+':''}${l.qty}</span></div>`).join('')||'<div class="empty">新增或調整庫存後會顯示在這裡。</div>';
    }
    function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
    function renderCart(){const count=cart.reduce((a,x)=>a+x.qty,0), total=cart.reduce((a,x)=>a+x.qty*Number(x.price),0);$('#cartCount').textContent=count+' 件';$('#cartTotal').textContent=money(total);$('#cartList').innerHTML=cart.length?cart.map(x=>`<div class="cart-item"><div><b>${esc(x.name)}</b><small>${money(x.price)}／件</small></div><div class="qty"><button onclick="cartChange('${x.id}',-1)">−</button><b>${x.qty}</b><button onclick="cartChange('${x.id}',1)">＋</button></div><strong>${money(x.qty*x.price)}</strong><button class="icon-btn" onclick="cartRemove('${x.id}')">移除</button></div>`).join(''):'<div class="empty">尚未加入商品</div>'}
    window.cartChange=(id,d)=>{const x=cart.find(i=>i.id===id),p=state.products.find(i=>i.id===id);if(!x)return;if(d>0&&x.qty>=p.stock)return notify('庫存不足');x.qty+=d;if(x.qty<=0)cart=cart.filter(i=>i.id!==id);renderCart()};window.cartRemove=id=>{cart=cart.filter(i=>i.id!==id);renderCart()};
    function addScan(){const code=$('#barcodeInput').value.trim();if(!code)return;const p=state.products.find(x=>x.sku===code||x.barcode===code||x.name===code);if(!p)return notify('找不到這個 SKU／條碼');if(!p.stock)return notify('這項商品已無庫存');const x=cart.find(i=>i.id===p.id);if(x){if(x.qty>=p.stock)return notify('庫存不足');x.qty++}else cart.push({...p,qty:1});$('#barcodeInput').value='';renderCart();notify('已加入購物車')}
    window.adjust=(id,delta)=>{const p=state.products.find(x=>x.id===id);if(!p||(delta<0&&p.stock<1))return notify(delta<0?'庫存不足':'找不到商品');p.stock=Number(p.stock)+delta;state.logs.unshift({name:p.name,type:delta>0?'入庫':'售出',qty:delta,time:new Date().toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})});save();notify(delta>0?'已入庫':'已記錄售出')};
    $('#productForm').addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));state.products.unshift({id:crypto.randomUUID(),...d,cost:Number(d.cost),price:Number(d.price),stock:Number(d.stock)});if(Number(d.stock))state.logs.unshift({name:d.name,type:'初始入庫',qty:Number(d.stock),time:new Date().toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})});e.target.reset();e.target.cost.value=0;e.target.price.value=0;e.target.stock.value=0;save();notify('商品已新增')});
    $('#inventoryMode').addEventListener('click',()=>{$('#inventoryMode').classList.add('active');$('#posMode').classList.remove('active');$('#inventoryLayout').classList.remove('hidden');$('#posPanel').classList.add('hidden')});$('#posMode').addEventListener('click',()=>{$('#posMode').classList.add('active');$('#inventoryMode').classList.remove('active');$('#inventoryLayout').classList.add('hidden');$('#posPanel').classList.remove('hidden');$('#barcodeInput').focus()});$('#scanBtn').addEventListener('click',addScan);$('#barcodeInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addScan()}});$('#checkoutBtn').addEventListener('click',()=>{if(!cart.length)return notify('購物車是空的');for(const x of cart){const p=state.products.find(i=>i.id===x.id);p.stock-=x.qty;state.logs.unshift({name:p.name,type:'POS售出・'+$('#payment').value,qty:-x.qty,time:new Date().toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})})}cart=[];save();renderCart();notify('結帳完成，庫存已扣除')});$('#search').addEventListener('input',render);$('#filter').addEventListener('change',render);$('#focusForm').addEventListener('click',()=>$('#formPanel').scrollIntoView({behavior:'smooth'}));$('#today').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
    $('#exportBtn').addEventListener('click',()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='anime-stall-backup.json';a.click();notify('備份檔已下載')});render();renderCart();
  </script>
</body></html>
